<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Promo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/cablevision.jpg" type="image/jpeg">
  <!-- CSS -->
  <link rel="stylesheet" href="/static/admin-promo.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <h2>Cablevision</h2>
      <p>Administrator</p>
    </div>
    <div class="sidebar-menu">
      <ul>
        <li><a href="/admin"><span class="menu-text">Dashboard</span></a></li>
       <li class="active"><a href="/admin/promo"><span class="menu-text">Promos</span></a></li>
        <li><a href="/admin/view-customers"><span class="menu-text">View Customers</span></a></li>
        <li><a href="/admin/internet-applications"><span class="menu-text">Applications</span></a></li>
      </ul>
    </div>
  </aside>

  <!-- ===== MAIN CONTENT ===== -->
  <div class="main-content">
    <!-- Header with live date/time -->
    <header class="dashboard-header">
      <div class="header-left">
        <h1>Promos Management</h1>
        <p>Cablevision Cable-Internet.</p>
      </div>
    </header>

    <!-- ===== PROMOS CARD ===== -->
 <section class="card" id="promosSection">
  <h2>Create Promo</h2>

  <form id="promoForm" class="promo-form">
    <input type="text" id="promoTitle" placeholder="Promo Title" required>
    <textarea id="promoDesc" placeholder="Promo Description" rows="4" required></textarea>
    <button type="submit" class="btn-primary">Create Promo</button>
  </form>

  <h3>Existing Promos</h3>
  <ul id="promoList" class="promo-list"></ul>
</section>
  </div>

  <!-- JS -->
   <script type="module" src="/static/admin-promo.js"></script>
</body>
</html>
